services:
  # Backend API (Express + TypeScript)
  - type: web
    name: grac-crm-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build
    # Runs after build, before the new version goes live. Applies any pending
    # database migrations (see server/src/migrations/). Aborts the deploy on
    # failure. NOTE: preDeployCommand requires a paid Render instance type;
    # on the free plan run `npm run migrate` manually (or via deploy.sh).
    preDeployCommand: npm run migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Public URL of the deployed frontend, used for CORS + OAuth return
      - key: CLIENT_URL
        sync: false
      # Public URL of this API (required for Square OAuth callbacks & webhooks)
      - key: PUBLIC_API_URL
        sync: false
      # Set the secret values below in the Render dashboard (never commit them)
      - key: MONGODB_URI_PRODUCTION
        sync: false
      # Required for Admin Panel → Database dual-cluster audit/import from
      # production. Same Atlas development URI as local .env. Atlas Network
      # Access on that cluster must allow Render outbound (often 0.0.0.0/0).
      - key: MONGODB_URI_DEVELOPMENT
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      # Optional: Square OAuth platform app (also configurable in Control Panel)
      - key: SQUARE_APPLICATION_ID
        sync: false
      - key: SQUARE_APPLICATION_SECRET
        sync: false
      - key: SQUARE_SANDBOX_APPLICATION_ID
        sync: false
      - key: SQUARE_SANDBOX_APPLICATION_SECRET
        sync: false
      # SMTP for password-reset and transactional email
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_SECURE
        value: "false"
      - key: EMAIL_FROM
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false

  # Frontend (Next.js static export served by a small Node process).
  # Render Static Site rewrites never applied /images/<slug>, so the CDN
  # served 404.html (and preloaded the OG jpg unused). This process proxies
  # slug paths to the API and serves `out/` for everything else.
  # Do not use the free plan: a sleeping origin would take the marketing site down.
  - type: web
    name: grac-crm-client
    runtime: node
    rootDir: client
    buildCommand: npm install && npm run build
    startCommand: npm run start:static
    envVars:
      # URL of the deployed backend API (baked into the bundle at build time)
      - key: NEXT_PUBLIC_API_URL
        sync: false
      # Canonical frontend origin used for public image links
      - key: NEXT_PUBLIC_SITE_URL
        value: https://genmaintoffl.com
